[package]
name = "nota-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
glob = "0.3.4"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.27.0"
